<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script DOM</title>
</head>

<body>
    <div class="container">
        <div class="box">
            This is a Box
        </div>
    </div>
    <script>
        document.title = " Debss is Good "
        console.log(document.title);
        console.log(document.body);
        document.body.style.backgroundColor = "Blue";
    </script>

    <!-- DOM ( Document Object Model ) is Mapping with the HTML structure to do changes in specific one object
     also DOM represents a document with a logical tree . each branch of the tree ends in a node with them you can change the document structure , style or content -->
     
    <!-- BOM ( Browser Object Model ) is Mapping with the Browser -->
</body>

</html>
