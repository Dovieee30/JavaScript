<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .child {
            background-color: lightblue;
            border: 2px solid black;
            margin: 14px;
            padding: 14px;
            cursor: pointer;
        }

        .childContainer {
            background-color: pink;
            margin: 14px;
            padding: 14px;

        }

        .Container {
            background-color: yellow;
            margin: 14px;
            padding: 14px;

        }
    </style>
</head>

<body>
    <div class="Container">
        <section class="childContainer">
            <div class="child">
                i am a child
            </div>
        </section>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("Child was Clicked");
        })
        document.querySelector(".childContainer").addEventListener("click", (e) => {
            //  e.stopPropagation();
            alert("ChildContainer was Clicked");
        })
        document.querySelector(".Container").addEventListener("click", (e) => {
            alert("Container was Clicked");
        })



        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1}, ${val2}, ${val3})`;
        }


        // let a = setInterval(() => {
        //     document.querySelector(".childContainer").style.background = getRandomColor()

        // }, 1000);

        // console.log(a)


        let a = setTimeout(() => {
            document.querySelector(".childContainer").style.background = getRandomColor()

        }, 3000);

        console.log(a)


        // set Interval used to change many color till the 5 seconds is done 
        // set Timeout changes one  color after 1 second 

    </script>
</body>

</html>
