<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>

        let r = Math.random();
        let first, second, third;

        // Lets Generate the First word
        if(r < 0.33){
            first = "Crazy"
            // 0 0.33 0.66 1
        }
        else if(r >= 0.33 && r < 0.66){
            first = "Amazing"

        }
        else{
            first = "Fire"
        }

        
        // Lets Generate the Second word
        if(r < 0.33){
            second = "Engine"
            // 0 0.33 0.66 1
        }
        else if(r >= 0.33 && r < 0.66){
            second = "Foode"

        }
        else{
            second = "Garments"
        }

        
        // Lets Generate the Third word
        if(r < 0.33){
            third = "Bros"
            // 0 0.33 0.66 1
        }
        else if(r >= 0.33 && r < 0.66){
            third = "Limited"

        }
        else{
            third = "Hub"
        }

        console.log(`The Name of Your Company is: ${first} ${second} ${third}`)


    </script>
    
</body>
</html>
